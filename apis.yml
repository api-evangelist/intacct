    Modern REST API for Sage Intacct using standard HTTP verbs and predictable
    URLs to operate on Intacct objects and data. Authenticates with OAuth 2.0 and
    supports batch, bulk, and composite requests. Sage recommends the REST API for
    new client applications; all new objects and features are released here first.
  humanURL: https://developer.sage.com/intacct/docs/openapi
