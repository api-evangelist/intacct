aid: intacct
name: Sage Intacct
description: >-
  Sage Intacct is a cloud-based financial management and accounting (ERP)
  platform for growing and mid-market businesses, delivering core financials,
  accounts payable and receivable, cash management, order and purchasing,
  multi-entity and global consolidations, project accounting, revenue
  recognition, dashboards and advanced reporting. The Sage Intacct Developer
  program exposes this functionality through two programmable interfaces: a
  modern REST API (OAuth 2.0, batch/bulk/composite requests) and the long-standing
  XML Web Services API, backed by official SDKs for PHP, .NET, and Node.js/JavaScript.
  New objects and features ship on the REST API first, and Sage's AI Gateway adds a
  governed Model Context Protocol (MCP) surface for AI agents on top of the same APIs.
